[project]
name = "jarvis"
version = "0.1.0"
description = "Jarvis: a voice-driven personal assistant that journals its work into an Obsidian vault."
readme = "README.md"
authors = [
    { name = "Zorrow", email = "htetaunglwin223@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "ddgs>=9.16.0",
    "fastapi>=0.141.1",
    "fastembed>=0.8.1",
    "faster-whisper>=1.2.1",
    "google-genai>=2.25.0",
    "httpx>=0.28.1",
    "onnxruntime>=1.30.0",
    "openwakeword>=0.4.0",
    "piper-tts>=1.8.0",
    "plyer>=2.1.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyttsx3>=2.99",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
    "webrtcvad-wheels>=2.0.14",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
packaging = [
    "pyinstaller>=6.22.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Starlette's TestClient nudges towards the optional `httpx2` package; httpx works fine.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
# E501: formatter owns line length.
# RUF001/RUF002: en dashes and similar are intentional in prose and docstrings.
ignore = ["E501", "RUF001", "RUF002"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
