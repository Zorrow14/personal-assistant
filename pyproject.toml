[project]
name = "jarvis"
version = "0.1.0"
description = "Jarvis: a voice-driven personal assistant that journals its work into an Obsidian vault."
readme = "README.md"
authors = [
    { name = "Zorrow", email = "htetaunglwin223@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "google-genai>=2.25.0",
    "piper-tts>=1.8.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyttsx3>=2.99",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "structlog>=26.1.0",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
